@if (appSettings.draft(); as settings) {
  <h2 class="text-sm font-medium">通用</h2>
  <p class="mt-1 text-xs text-(--app-muted)">开机启动与外观</p>

  <label class="mt-4 flex items-center gap-2 text-sm">
    <input
      type="checkbox"
      [ngModel]="settings.general.launchAtLogin"
      [disabled]="appSettings.saving()"
      (ngModelChange)="onLaunchAtLoginChange($event)"
    />
    开机启动
  </label>
  <p class="mt-2 text-xs text-(--app-muted)">登录后静默进托盘，不弹出设置窗</p>

  <fieldset class="mt-4 m-0 min-w-0 border-0 p-0">
    <legend class="mb-2 px-0 text-sm">外观</legend>
    <div class="flex flex-col gap-3">
      @for (option of appearanceOptions; track option.value) {
        <label class="flex cursor-pointer items-start gap-2 text-sm">
          <input
            type="radio"
            class="mt-0.5"
            name="appearance"
            [value]="option.value"
            [ngModel]="settings.general.appearance"
            [disabled]="appSettings.saving()"
            (ngModelChange)="onAppearanceChange($event)"
          />
          <span class="min-w-0">
            <span class="block">{{ option.label }}</span>
            <span class="mt-0.5 block text-xs text-(--app-muted)">{{ option.hint }}</span>
          </span>
        </label>
      }
    </div>
  </fieldset>

  <p class="mt-3 text-xs text-(--app-muted)">保存后生效</p>
}
