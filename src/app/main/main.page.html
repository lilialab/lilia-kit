<main class="flex h-screen flex-col bg-(--app-bg) text-(--app-fg)">
  <header class="shrink-0 px-5 pt-5 pb-3">
    <h1 class="text-xl font-semibold tracking-tight">LiliaKit</h1>
    <p class="mt-1 text-sm text-(--app-muted)">选择工具并配置</p>
  </header>

  @if (appSettings.error(); as message) {
    <p class="shrink-0 px-5 pb-2 text-sm text-(--app-danger)" role="alert">{{ message }}</p>
  }

  @if (appSettings.ready() && appSettings.draft()) {
    <div class="flex min-h-0 flex-1 border-t border-(--app-border)">
      <nav
        class="flex w-44 shrink-0 flex-col gap-1 border-r border-(--app-border) p-2"
        aria-label="工具"
      >
        <button
          type="button"
          class="rounded-lg bg-(--app-surface) px-2 py-1.5 text-left text-sm"
        >
          监视器
        </button>
      </nav>

      <section class="min-w-0 flex-1 overflow-y-auto p-4" aria-live="polite">
        <app-monitor-settings />
      </section>
    </div>

    <footer class="flex shrink-0 items-center justify-end gap-3 border-t border-(--app-border) px-5 py-3">
      <button
        type="button"
        class="rounded border border-(--app-border) bg-(--app-surface) px-3 py-1.5 text-sm text-(--app-muted) hover:bg-(--app-surface-hover) hover:text-(--app-fg) disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!appSettings.dirty() || appSettings.saving()"
        (click)="appSettings.restore()"
      >
        还原
      </button>
      <button
        type="button"
        class="rounded border border-(--app-border) bg-(--app-surface) px-3 py-1.5 text-sm hover:bg-(--app-surface-hover) disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!appSettings.dirty() || appSettings.saving()"
        (click)="appSettings.save()"
      >
        保存
      </button>
    </footer>
  } @else {
    <p class="px-5 text-sm text-(--app-muted)">加载中…</p>
  }
</main>
