<div class="flex items-center gap-2">
  <span class="shrink-0 text-(--app-muted) [&_svg]:block">
    <ng-content />
  </span>
  <div class="h-1.5 min-w-0 flex-1 rounded-full bg-(--app-border)">
    <div
      class="h-full rounded-full transition-[width,background-color] duration-200 ease-out"
      [style.width.%]="barWidth()"
      [style.background-color]="barColor()"
    ></div>
  </div>
  <span class="w-8 shrink-0 text-right text-[0.7rem] font-medium tabular-nums">
    {{ percentLabel() }}
  </span>
</div>
