<main
  class="monitor-shell relative flex h-screen flex-col justify-center gap-2 overflow-hidden px-2.5 py-2 text-(--app-fg) select-none"
>
  <!-- 全窗拖拽命中层：盖住子节点，避免文字/SVG 抢走拖拽 -->
  <div class="absolute inset-0 z-10" data-tauri-drag-region></div>

  @if (error(); as message) {
    <p class="relative m-0 truncate text-[0.7rem] text-(--app-danger)" role="alert">{{ message }}</p>
  } @else if (metrics(); as m) {
    <section class="relative flex flex-col gap-2" aria-live="polite">
      <app-monitor-metric-bar [percent]="m.cpuPercent">
        <svg lucideCpu [size]="iconSize" [strokeWidth]="2"></svg>
      </app-monitor-metric-bar>

      <app-monitor-metric-bar [percent]="memoryPercent(m)">
        <svg lucideMemoryStick [size]="iconSize" [strokeWidth]="2"></svg>
      </app-monitor-metric-bar>

      <app-monitor-net-temp
        [rxBytesPerSec]="m.networkRxBytesPerSec"
        [txBytesPerSec]="m.networkTxBytesPerSec"
        [temperatures]="m.temperatures"
      />
    </section>
  } @else {
    <p class="relative m-0 text-[0.7rem] text-(--app-muted)">读取中…</p>
  }
</main>
